<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terjadi Kesalahan Sistem</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="container text-center">
        <div class="card shadow p-5 mx-auto" style="max-width: 500px;">
            <div class="card-body">
                <h1 class="display-1 text-danger fw-bold">⚠️</h1>
                <h3 class="card-title text-danger mb-3">Terjadi Kesalahan!</h3>
                <p class="card-text text-muted">
                    Maaf, sistem mengalami kendala saat memproses permintaan Anda. 
                    Silakan coba beberapa saat lagi atau kembali ke halaman utama.
                </p>
                {% if error_message %}
                <div class="alert alert-warning text-start small font-monospace mt-3" role="alert">
                    <strong>Detail:</strong> {{ error_message }}
                </div>
                {% endif %}
                <a href="{% url 'dashboard' %}" class="btn btn-primary mt-3 w-100">Kembali ke Dashboard</a>
            </div>
        </div>
    </div>
</body>
</html>
