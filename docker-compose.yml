services:

  postgres:
    image: postgres:18.1

    container_name: postgres_db

    restart: always

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5433:5433"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:

    build: .

    container_name: SI-BASMA

    command: python manage.py runserver 127.0.0.1:8000

    ports:
      - "8000:8000"

    volumes:
      - ./app:/app

    env_file:
      - .env

    depends_on:
      - postgres

volumes:
  postgres_data: